[project]
name = "agentic-app"
version = "0.1.0"
description = "Employee helpdesk agent demo on Google ADK: RAG, MCP actions with approval, memory, guardrail, eval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[mcp,eval]==2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
